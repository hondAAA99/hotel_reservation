<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORS Tester</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --danger: #f87171;
        --success: #4ade80;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .card {
        width: min(800px, 92vw);
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      h1 {
        margin-top: 0;
        font-size: 1.8rem;
      }

      .input-row {
        display: flex;
        gap: 12px;
        margin: 18px 0;
      }

      input {
        flex: 1;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        padding: 12px 14px;
        font-size: 1rem;
      }

      .buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      button {
        background: var(--accent);
        color: #08111f;
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #374151;
        color: var(--text);
      }

      .status {
        margin-top: 12px;
        padding: 14px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        min-height: 120px;
        white-space: pre-wrap;
        font-family: 'SFMono-Regular', Consolas, monospace;
        color: var(--muted);
      }

      .status.success {
        border-color: rgba(74, 222, 128, 0.5);
        color: #d1fae5;
      }
      .status.error {
        border-color: rgba(248, 113, 113, 0.5);
        color: #fecaca;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>CORS Policy Tester</h1>
      <p>
        Enter the URL you want to test. This page only performs 2 browser
        requests when you click the buttons below.
      </p>

      <div class="input-row">
        <input
          id="targetUrl"
          type="text"
          value="https://handsaw-lubricant-yogurt.ngrok-free.dev"
          placeholder="https://api.example.com/test"
        />
      </div>

      <div class="buttons">
        <button id="requestOne">1) Simple GET</button>
        <button id="requestTwo" class="secondary">2) Preflighted POST</button>
      </div>

      <div id="result" class="status">No request sent yet.</div>
    </div>

    <script>
      const targetUrl = document.getElementById('targetUrl')
      const result = document.getElementById('result')

      function setResult(text, type = '') {
        result.className = `status ${type}`.trim()
        result.textContent = text
      }

      function safeJson(value) {
        try {
          return JSON.stringify(value, null, 2)
        } catch {
          return String(value)
        }
      }

      async function testSimpleGet() {
        const rawUrl = targetUrl.value.trim()
        if (!rawUrl) {
          setResult('Please enter a URL first.', 'error')
          return
        }

        const url = rawUrl.replace(/\s+/g, '').replace(/\/$/, '')

        try {
          setResult(`Sending request 1: GET to ${url} ...`, '')
          const response = await fetch(url, {
            method: 'GET',
            mode: 'cors',
          })

          const text = await response.text()
          setResult(
            `Request 1 result\nStatus: ${response.status} ${response.statusText}\nHeaders: ${safeJson(Object.fromEntries(response.headers.entries()))}\nBody: ${text.slice(0, 1000)}`,
            response.ok ? 'success' : 'error',
          )
        } catch (error) {
          setResult(`Request 1 failed\nURL: ${url}\n${error.message}`, 'error')
        }
      }

      async function testPreflightedPost() {
        const rawUrl = targetUrl.value.trim()
        if (!rawUrl) {
          setResult('Please enter a URL first.', 'error')
          return
        }

        const url = rawUrl.replace(/\s+/g, '').replace(/\/$/, '')

        try {
          setResult(
            `Sending request 2: POST to ${url} with custom headers ...`,
            '',
          )
          const response = await fetch(url, {
            method: 'POST',
            mode: 'cors',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer test-token',
              'X-Test-Header': 'cors-check',
            },
            body: JSON.stringify({ source: 'cors-gui', ok: true }),
          })

          const text = await response.text()
          setResult(
            `Request 2 result\nStatus: ${response.status} ${response.statusText}\nHeaders: ${safeJson(Object.fromEntries(response.headers.entries()))}\nBody: ${text.slice(0, 1000)}`,
            response.ok ? 'success' : 'error',
          )
        } catch (error) {
          setResult(`Request 2 failed\nURL: ${url}\n${error.message}`, 'error')
        }
      }

      document
        .getElementById('requestOne')
        .addEventListener('click', testSimpleGet)
      document
        .getElementById('requestTwo')
        .addEventListener('click', testPreflightedPost)
    </script>
  </body>
</html>
